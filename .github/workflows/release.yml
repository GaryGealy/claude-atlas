name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Check package.json version matches tag
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$PKG_VERSION" != "${GITHUB_REF_NAME#v}" ]; then
            echo "package.json version $PKG_VERSION does not match tag $GITHUB_REF_NAME" >&2
            exit 1
          fi
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm pack
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" claude-atlas-*.tgz --generate-notes
